<!DOCTYPE html>
<html>
<head>
    <title>loadeddata Event Example</title>
</head>
<body>
    <video id="myVideo" width="400" autoplay muted loop src="https://youtu.be/eWiPifj3T8g?si=GtVL9cp4xhiCaFf0">
        Your browser does not support HTML video.
    </video>

    <script>
        // Get the video element
        const video = document.getElementById('myVideo');

        // Add event listener for 'loadeddata'
        video.addEventListener('loadeddata', function () {
            console.log('First frame of the video is loaded.');
            alert('Video data loaded and ready to display first frame!');
        });

        // Optional: Handle errors
        video.addEventListener('error', function (e) {
            console.error('Error loading video:', e);
        });
    </script>
</body>
</html>
